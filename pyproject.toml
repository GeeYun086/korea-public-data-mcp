[project]
name = "korea-public-data-mcp"
version = "0.1.0"
description = "Korean public-data (OpenDART / ECOS / KOSIS / data.go.kr) MCP server — answers questions with numbers pulled live from official government APIs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0.0,<3.0.0",
    "httpx>=0.27.0",
    "cachetools>=5.3.0",
    "tenacity>=8.2.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.6.0",
]

[project.scripts]
korea-public-data-mcp = "korea_public_data_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/korea_public_data_mcp"]
